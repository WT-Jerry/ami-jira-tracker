<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JIRA Issue Tracker | AMI & Dell</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

        :root {
            --ami-red: #ef4444;
            --ami-green: #10b981;
            --ami-blue: #2563eb;
            --ami-cyan: #0ea5e9;
            --ami-bg0: #f3f6fb;
            --ami-bg1: #e8eef8;
            --ami-panel: rgba(255,255,255,0.86);
            --ami-border: rgba(148,163,184,0.35);
            --ami-text: #0f172a;
            --ami-muted: #64748b;

            --dell-bg: #070a10;
            --dell-panel: rgba(18, 24, 38, 0.92);
            --dell-panel-2: #121a2a;
            --dell-border: rgba(56, 189, 248, 0.18);
            --dell-text: #e8eefc;
            --dell-muted: #93a4c3;
            --dell-accent: #0076ce;
            --dell-accent-2: #22d3ee;
            --dell-open: #f43f5e;
            --dell-closed: #22c55e;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif;
            transition: background 0.3s ease, color 0.3s ease;
            min-height: 100vh;
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            background-image:
                linear-gradient(rgba(37,99,235,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(37,99,235,0.04) 1px, transparent 1px);
            background-size: 28px 28px;
            mask-image: radial-gradient(circle at center, black 35%, transparent 90%);
        }

        .container { max-width: 1320px; }
        .app-shell {
            border: 1px solid var(--shell-border, transparent);
            border-radius: 20px;
            padding: 1.1rem 1.1rem 1.4rem;
            backdrop-filter: blur(10px);
            box-shadow: var(--shell-shadow, none);
            background: var(--shell-bg, transparent);
        }
        .hero-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
            padding-bottom: 0.9rem;
            border-bottom: 1px solid var(--divider, rgba(148,163,184,0.25));
        }
        .brand-kicker {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--accent, #2563eb);
            margin-bottom: 0.35rem;
        }
        .brand-kicker .dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--accent, #2563eb);
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent, #2563eb) 20%, transparent);
        }
        .brand-title-row {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            flex-wrap: wrap;
        }
        .brand-title-row h2 {
            font-size: 1.55rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0;
        }
        .version-chip {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            padding: 0.2rem 0.5rem;
            border-radius: 999px;
            border: 1px solid var(--chip-border, #cbd5e1);
            background: var(--chip-bg, #fff);
            color: var(--chip-text, #475569);
        }
        .card {
            border: 1px solid var(--panel-border, transparent);
            border-radius: 16px;
            background: var(--panel-bg, #fff);
            box-shadow: var(--panel-shadow, none);
        }
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: none; justify-content: center; align-items: center; z-index: 2000;
            backdrop-filter: blur(4px);
        }
        .loading-box {
            border-radius: 16px;
            padding: 1.4rem 1.8rem;
            border: 1px solid rgba(148,163,184,0.25);
            background: rgba(15,23,42,0.85);
            color: #e2e8f0;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
        }
        .stat-card {
            transition: transform 0.2s, box-shadow 0.2s;
            flex: 1;
            min-width: 110px;
            border-radius: 14px !important;
            position: relative;
            overflow: hidden;
        }
        .stat-card::after {
            content: "";
            position: absolute;
            right: -10px; top: -10px;
            width: 60px; height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.22), transparent 70%);
            pointer-events: none;
        }
        .stat-card:hover { transform: translateY(-4px); }
        .stat-card .stat-label {
            font-size: 0.68rem;
            letter-spacing: 0.14em;
            font-weight: 700;
        }
        .jira-code {
            font-family: 'IBM Plex Mono', 'Courier New', monospace;
            font-weight: 600;
            font-size: 0.92rem;
        }
        .workspace-tabs {
            display: inline-flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 1rem;
            padding: 5px;
            border-radius: 14px;
            border: 1px solid var(--tabs-border, rgba(148,163,184,0.3));
            background: var(--tabs-bg, rgba(255,255,255,0.7));
        }
        .workspace-tabs .nav-btn {
            border: 1px solid transparent;
            border-radius: 10px;
            padding: 0.48rem 1rem;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            background: transparent;
        }
        .workspace-tabs .nav-btn.active {
            color: #fff;
            box-shadow: 0 8px 20px rgba(37,99,235,0.28);
        }
        .toolbar-row .btn {
            border-radius: 10px;
            font-weight: 600;
            letter-spacing: 0.01em;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent, #2563eb), var(--accent-2, #0ea5e9));
            border: none;
            box-shadow: 0 8px 18px color-mix(in srgb, var(--accent, #2563eb) 30%, transparent);
        }
        .btn-primary:hover {
            filter: brightness(1.05);
        }
        .table-wrap {
            border: 1px solid var(--panel-border, #e2e8f0);
            border-radius: 16px;
            overflow: hidden;
            background: var(--panel-bg, #fff);
            box-shadow: var(--panel-shadow, 0 10px 30px rgba(15,23,42,0.05));
        }
        .table {
            --bs-table-bg: transparent;
            margin-bottom: 0;
        }
        .table thead th {
            border-top: none;
            text-transform: uppercase;
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            font-weight: 700;
            vertical-align: middle;
            text-align: left;
            line-height: 1.25;
            padding-top: 0.95rem;
            padding-bottom: 0.95rem;
        }
        .table tbody td {
            vertical-align: middle;
            padding-top: 0.85rem;
            padding-bottom: 0.85rem;
        }
        .table tbody tr {
            transition: background 0.15s ease;
        }
        .form-control, .form-select, .input-group-text {
            border-radius: 10px;
        }
        .input-group .form-control {
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
        }
        .input-group-text {
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
        }
        .modal-content {
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--panel-border, #e2e8f0);
            box-shadow: 0 25px 60px rgba(2,6,23,0.28);
        }
        .modal-header, .modal-footer {
            border-color: var(--divider, #e2e8f0);
        }
        .bg-open, .bg-closed {
            border: none !important;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
        }
        /* Status：顯眼紅/綠膠囊 + 自訂下拉（避免原生 option 洗色） */
        .status-dropdown {
            position: relative;
            display: inline-block;
        }
        .status-pill-btn {
            min-width: 108px;
            border: none !important;
            border-radius: 999px !important;
            font-weight: 700 !important;
            font-size: 0.85rem !important;
            padding: 0.35rem 0.85rem !important;
            color: #fff !important;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15), 0 4px 12px rgba(15,23,42,0.12);
        }
        .status-pill-btn.bg-open {
            background: linear-gradient(135deg, #ef4444, #f97316) !important;
        }
        .status-pill-btn.bg-closed {
            background: linear-gradient(135deg, #10b981, #14b8a6) !important;
        }
        .status-pill-btn::after {
            margin-left: 0.45rem;
        }
        .status-menu {
            min-width: 120px;
            padding: 0.35rem;
            border-radius: 12px !important;
            border: 1px solid rgba(148,163,184,0.35) !important;
            box-shadow: 0 12px 28px rgba(15,23,42,0.16) !important;
        }
        .status-menu .dropdown-item {
            border-radius: 8px;
            font-weight: 700;
            padding: 0.45rem 0.7rem;
        }
        .status-menu .dropdown-item.status-opt-open {
            color: #b91c1c;
        }
        .status-menu .dropdown-item.status-opt-open:hover,
        .status-menu .dropdown-item.status-opt-open:focus {
            background: rgba(239, 68, 68, 0.12);
            color: #991b1b;
        }
        .status-menu .dropdown-item.status-opt-closed {
            color: #047857;
        }
        .status-menu .dropdown-item.status-opt-closed:hover,
        .status-menu .dropdown-item.status-opt-closed:focus {
            background: rgba(16, 185, 129, 0.12);
            color: #065f46;
        }
        .status-menu .dropdown-item.active-opt {
            outline: 1px solid rgba(148,163,184,0.35);
        }

        /* ===== AMI Theme (professional light tech) ===== */
        body.theme-ami {
            --accent: #2563eb;
            --accent-2: #0ea5e9;
            --shell-bg: linear-gradient(180deg, rgba(255,255,255,0.75), rgba(255,255,255,0.55));
            --shell-border: rgba(148,163,184,0.28);
            --shell-shadow: 0 20px 50px rgba(15,23,42,0.08);
            --divider: rgba(148,163,184,0.28);
            --panel-bg: rgba(255,255,255,0.9);
            --panel-border: rgba(148,163,184,0.28);
            --panel-shadow: 0 12px 28px rgba(15,23,42,0.06);
            --tabs-bg: rgba(255,255,255,0.75);
            --tabs-border: rgba(148,163,184,0.3);
            --chip-bg: #eff6ff;
            --chip-border: #bfdbfe;
            --chip-text: #1d4ed8;
            background:
                radial-gradient(1200px 500px at 10% -10%, rgba(37,99,235,0.14), transparent 55%),
                radial-gradient(900px 400px at 90% 0%, rgba(14,165,233,0.12), transparent 50%),
                linear-gradient(180deg, var(--ami-bg0), var(--ami-bg1));
            color: var(--ami-text);
        }
        body.theme-ami .loading-overlay { background: rgba(241,245,249,0.55); }
        body.theme-ami .brand-title { color: var(--ami-blue); }
        body.theme-ami .workspace-tabs .nav-btn { color: #475569; }
        body.theme-ami .workspace-tabs .nav-btn.active {
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            border-color: transparent;
            color: #fff;
        }
        body.theme-ami .card,
        body.theme-ami .stat-card,
        body.theme-ami .input-group-text,
        body.theme-ami .form-control,
        body.theme-ami .form-select {
            background-color: #fff;
            color: var(--ami-text);
            border-color: #dbe3ef;
        }
        body.theme-ami .stat-card {
            box-shadow: 0 10px 24px rgba(15,23,42,0.05);
        }
        body.theme-ami .table thead th {
            background: linear-gradient(180deg, #f8fafc, #eef2ff);
            color: #475569;
            border-bottom: 1px solid #e2e8f0;
        }
        body.theme-ami .table tbody tr:hover {
            background: rgba(37,99,235,0.035);
        }
        body.theme-ami .bg-open { background: linear-gradient(135deg, #ef4444, #f97316) !important; color: white !important; }
        body.theme-ami .bg-closed { background: linear-gradient(135deg, #10b981, #14b8a6) !important; color: white !important; }
        body.theme-ami .status-menu {
            background: #fff !important;
        }
        body.theme-ami .jira-code { color: #1d4ed8; }
        body.theme-ami .dell-jira-link {
            color: #db2777 !important;
            font-weight: 700;
            text-decoration: none !important;
        }
        body.theme-ami .dell-jira-link:hover {
            color: #9d174d !important;
        }
        body.theme-ami .dell-jira-text {
            color: #7c3aed;
            font-weight: 700;
        }
        body.theme-ami .table a { color: #0f172a; }
        body.theme-ami .table a:hover { color: #2563eb; }
        body.theme-ami .muted-label { color: var(--ami-muted); }
        body.theme-ami .btn-light,
        body.theme-ami .btn-outline-secondary {
            background: #fff;
            border-color: #cbd5e1;
            color: #334155;
        }
        body.theme-ami .btn-success {
            background: linear-gradient(135deg, #059669, #0d9488);
            border: none;
        }

        /* ===== Dell Theme (deep tech black) ===== */
        body.theme-dell {
            --accent: #0076ce;
            --accent-2: #22d3ee;
            --shell-bg: linear-gradient(180deg, rgba(15,23,42,0.78), rgba(8,12,22,0.72));
            --shell-border: rgba(34,211,238,0.14);
            --shell-shadow: 0 24px 60px rgba(0,0,0,0.45);
            --divider: rgba(148,163,184,0.16);
            --panel-bg: var(--dell-panel);
            --panel-border: var(--dell-border);
            --panel-shadow: 0 16px 40px rgba(0,0,0,0.35);
            --tabs-bg: rgba(15,23,42,0.7);
            --tabs-border: rgba(34,211,238,0.16);
            --chip-bg: rgba(14,165,233,0.12);
            --chip-border: rgba(34,211,238,0.3);
            --chip-text: #67e8f9;
            background:
                radial-gradient(1000px 420px at 15% -5%, rgba(0,118,206,0.22), transparent 55%),
                radial-gradient(800px 380px at 90% 0%, rgba(34,211,238,0.12), transparent 50%),
                linear-gradient(180deg, #0a101b, var(--dell-bg));
            color: var(--dell-text);
        }
        body.theme-dell::before {
            background-image:
                linear-gradient(rgba(34,211,238,0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34,211,238,0.045) 1px, transparent 1px);
        }
        body.theme-dell .loading-overlay { background: rgba(2,6,23,0.72); }
        body.theme-dell .brand-title { color: var(--dell-accent-2); }
        body.theme-dell .workspace-tabs .nav-btn { color: var(--dell-muted); }
        body.theme-dell .workspace-tabs .nav-btn.active {
            background: linear-gradient(135deg, var(--dell-accent), var(--dell-accent-2));
            border-color: transparent;
            color: #041018;
            box-shadow: 0 10px 28px rgba(34,211,238,0.25);
        }
        body.theme-dell .card,
        body.theme-dell .stat-card {
            background: var(--dell-panel) !important;
            color: var(--dell-text);
            border: 1px solid var(--dell-border) !important;
            box-shadow: 0 12px 30px rgba(0,0,0,0.35) !important;
        }
        body.theme-dell .stat-card.border-start { border-left-width: 4px !important; }
        body.theme-dell .muted-label,
        body.theme-dell .text-muted,
        body.theme-dell .form-label { color: var(--dell-muted) !important; }
        body.theme-dell .form-control,
        body.theme-dell .form-select,
        body.theme-dell .input-group-text {
            background: var(--dell-panel-2);
            border-color: rgba(148,163,184,0.2);
            color: var(--dell-text);
        }
        body.theme-dell .form-control::placeholder { color: #6b7c99; }
        body.theme-dell .form-control:focus,
        body.theme-dell .form-select:focus {
            background: var(--dell-panel-2);
            border-color: var(--dell-accent-2);
            color: var(--dell-text);
            box-shadow: 0 0 0 0.2rem rgba(34,211,238,0.15);
        }
        body.theme-dell .btn-primary {
            background: linear-gradient(135deg, var(--dell-accent), var(--dell-accent-2));
            border: none;
            color: #041018;
            font-weight: 700;
        }
        body.theme-dell .btn-success {
            background: linear-gradient(135deg, #0f766e, #14b8a6);
            border: none;
        }
        body.theme-dell .btn-light,
        body.theme-dell .btn-outline-secondary {
            background: #121a2a;
            border-color: rgba(148,163,184,0.25);
            color: var(--dell-text);
        }
        body.theme-dell .btn-light:hover,
        body.theme-dell .btn-outline-secondary:hover {
            background: #1a2438;
            color: #fff;
        }
        body.theme-dell .table {
            color: var(--dell-text);
            --bs-table-hover-bg: rgba(34,211,238,0.05);
        }
        body.theme-dell .table thead th {
            background: linear-gradient(180deg, #121a2a, #0e1522);
            border-bottom: 1px solid rgba(34,211,238,0.15);
            color: #9fb2d1;
        }
        body.theme-dell .table td,
        body.theme-dell .table th {
            border-color: rgba(148,163,184,0.12);
        }
        body.theme-dell .bg-open { background: linear-gradient(135deg, #f43f5e, #fb7185) !important; color: white !important; }
        body.theme-dell .bg-closed { background: linear-gradient(135deg, #16a34a, #22c55e) !important; color: white !important; }
        body.theme-dell .status-pill-btn.bg-open {
            background: linear-gradient(135deg, #f43f5e, #fb7185) !important;
        }
        body.theme-dell .status-pill-btn.bg-closed {
            background: linear-gradient(135deg, #16a34a, #22c55e) !important;
        }
        body.theme-dell .status-menu {
            background: #0f172a !important;
            border-color: rgba(34,211,238,0.2) !important;
        }
        body.theme-dell .status-menu .dropdown-item.status-opt-open { color: #fda4af; }
        body.theme-dell .status-menu .dropdown-item.status-opt-closed { color: #86efac; }
        body.theme-dell .status-menu .dropdown-item:hover,
        body.theme-dell .status-menu .dropdown-item:focus {
            background: rgba(148,163,184,0.12);
        }
        body.theme-dell .jira-code { color: #67e8f9; }
        body.theme-dell .table a { color: #e2e8f0; }
        body.theme-dell .table a:hover { color: #67e8f9; }
        body.theme-dell .badge.bg-light {
            background: #1a2438 !important;
            color: #dbeafe !important;
            border-color: rgba(148,163,184,0.2) !important;
        }
        body.theme-dell .modal-content {
            background: #0f172a;
            color: var(--dell-text);
            border: 1px solid rgba(34,211,238,0.18);
        }
        body.theme-dell .modal-header,
        body.theme-dell .modal-footer {
            border-color: rgba(148,163,184,0.15);
        }
        body.theme-dell .btn-close {
            filter: invert(1) grayscale(100%);
        }
        body.theme-dell .btn-secondary {
            background: #1f2937;
            border-color: #1f2937;
        }

        /* 手機版排版優化 */
        @media (max-width: 767.98px) {
            .app-shell { padding: 0.85rem; border-radius: 14px; }
            .stat-container { gap: 10px !important; }
            .stat-card { padding: 8px !important; }
            .stat-card .h4 { font-size: 1.1rem; }
            .responsive-table thead { display: none; }
            .responsive-table tr {
                display: block;
                margin-bottom: 1rem;
                border-radius: 14px;
                padding: 10px;
            }
            body.theme-ami .responsive-table tr {
                border: 1px solid #e2e8f0;
                background: white;
                box-shadow: 0 8px 18px rgba(15,23,42,0.05);
            }
            body.theme-dell .responsive-table tr {
                border: 1px solid var(--dell-border);
                background: var(--dell-panel);
                box-shadow: 0 10px 24px rgba(0,0,0,0.28);
            }
            .responsive-table td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                border: none;
                padding: 5px 10px;
                text-align: left;
            }
            .responsive-table td::before {
                content: attr(data-label);
                font-weight: bold;
                width: 100px;
                min-width: 100px;
                font-size: 0.8rem;
            }
            body.theme-ami .responsive-table td::before { color: #64748b; }
            body.theme-dell .responsive-table td::before { color: var(--dell-muted); }
            .responsive-table td:last-child {
                justify-content: flex-end;
                margin-top: 5px;
                padding-top: 10px;
            }
            body.theme-ami .responsive-table td:last-child { border-top: 1px solid #e2e8f0; }
            body.theme-dell .responsive-table td:last-child { border-top: 1px solid rgba(148,163,184,0.15); }
            .responsive-table td:last-child::before { display: none; }
            .container { padding-left: 10px; padding-right: 10px; }
            h2 { font-size: 1.25rem !important; }
        }
    </style>
</head>
<body class="container mt-3 mt-md-4 theme-ami">
    <div id="loading" class="loading-overlay">
        <div class="loading-box text-center">
            <div class="spinner-border text-info" role="status"></div>
            <div class="mt-2 fw-bold loading-text">雲端同步中...</div>
        </div>
    </div>

    <div class="app-shell">
    <!-- 分頁切換 -->
    <div class="workspace-tabs">
        <button type="button" class="nav-btn active" id="tabAmi" onclick="switchWorkspace('ami')">
            <i class="bi bi-building"></i> AMI Tracker
        </button>
        <button type="button" class="nav-btn" id="tabDell" onclick="switchWorkspace('dell')">
            <i class="bi bi-hdd-network"></i> Dell Tracker
        </button>
    </div>

    <div class="hero-bar">
        <div>
            <div class="brand-kicker"><span class="dot"></span><span id="brandKickerText">ISSUE CONTROL CENTER</span></div>
            <div class="brand-title-row">
                <i class="bi bi-cpu brand-title fs-3" id="pageIcon"></i>
                <h2 id="pageTitle">AMI JIRA Tracker</h2>
                <span class="version-chip" id="pageVersion">V1</span>
            </div>
            <div class="small muted-label mt-2" id="pageSubtitle">AMI 案件追蹤 · GitHub data.json</div>
        </div>
        <div class="d-flex align-items-center gap-2 flex-wrap">
            <input type="password" id="patInput" class="form-control form-control-sm" style="width: 210px;" placeholder="Enter GitHub PAT">
            <button class="btn btn-sm btn-outline-secondary" onclick="savePAT()">Save PAT</button>
        </div>
    </div>

    <div class="d-flex stat-container gap-2 gap-md-3 mb-4">
        <div class="stat-card p-3 bg-white shadow-sm border-start border-danger border-4 text-center text-md-start">
            <div class="muted-label stat-label">OPEN</div>
            <div id="openCount" class="h3 fw-bold m-0 text-danger">0</div>
        </div>
        <div class="stat-card p-3 bg-white shadow-sm border-start border-success border-4 text-center text-md-start">
            <div class="muted-label stat-label">CLOSED</div>
            <div id="closedCount" class="h3 fw-bold m-0 text-success">0</div>
        </div>
        <div class="stat-card p-3 bg-white shadow-sm border-start border-primary border-4 text-center text-md-start">
            <div class="muted-label stat-label">TOTAL</div>
            <div id="totalCount" class="h3 fw-bold m-0 text-primary">0</div>
        </div>
    </div>

    <!-- 工具列：新增 / 搜尋 / 匯出 / 刷新 -->
    <div class="row mb-3 align-items-center g-2 toolbar-row">
        <div class="col-12 col-md-auto">
            <button class="btn btn-primary fw-bold shadow-sm btn-sm px-4 w-100 w-md-auto" onclick="openAddModal()">
                <i class="bi bi-plus-lg"></i> 新增案件
            </button>
        </div>
        <div class="col-12 col-md">
            <div class="input-group shadow-sm">
                <span class="input-group-text border-end-0 px-2"><i class="bi bi-search small"></i></span>
                <input type="text" id="searchInput" class="form-control border-start-0 form-control-sm" placeholder="快速搜尋..." oninput="renderIssues()">
            </div>
        </div>
        <div class="col-12 col-md-auto text-md-end">
            <button class="btn btn-success shadow-sm border btn-sm me-2" onclick="exportToExcel()">
                <i class="bi bi-file-earmark-spreadsheet"></i> <span class="d-none d-md-inline">匯出 Excel</span>
            </button>
            <button class="btn btn-light shadow-sm border btn-sm" onclick="fetchIssues()">
                <i class="bi bi-arrow-clockwise"></i> <span class="d-none d-md-inline">刷新雲端</span>
            </button>
        </div>
    </div>

    <!-- Issue 列表表格 -->
    <div class="table-wrap">
        <div class="card-body p-0 overflow-hidden">
            <table class="table table-hover align-middle mb-0 responsive-table">
                <thead>
                    <tr>
                        <th width="70" class="ps-4">Index</th>
                        <th width="120">Status</th>
                        <th width="110">Function</th>
                        <th width="140">Jira Number</th>
                        <th width="150" class="ami-only-col">Dell JIRA Number</th>
                        <th>Issue Title</th>
                        <th width="120" class="pe-4">Action</th>
                    </tr>
                </thead>
                <tbody id="issueList" class="border-top-0">
                    <tr><td colspan="7" class="text-center py-5">讀取中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    </div><!-- /.app-shell -->

    <!-- 新增案件彈出視窗 -->
    <div class="modal fade" id="addModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title fw-bold">新增案件</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
                <label class="form-label fw-bold small muted-label">Status</label>
                <select id="statusInput" class="form-select">
                    <option value="Open">🔴 Open</option>
                    <option value="Closed">🟢 Closed</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold small muted-label">Function</label>
                <input type="text" id="functionInput" class="form-control" list="funcList" placeholder="選擇...">
                <datalist id="funcList">
                    <option value="BIOS">
                    <option value="BMC">
                    <option value="BIOS+BMC">
                    <option value="Firmware">
                    <option value="Hardware">
                    <option value="Unknown">
                </datalist>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold small muted-label">Jira Number</label>
                <input type="text" id="jiraInput" class="form-control" placeholder="MSG-XXXXX / BFGS-XXXXX" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold small muted-label">Issue Title</label>
                <input type="text" id="titleInput" class="form-control" placeholder="描述標題..." required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold small muted-label">Issue Link</label>
                <input type="url" id="linkInput" class="form-control" placeholder="https://..." required>
            </div>
            <div class="mb-3 ami-only-field">
                <label class="form-label fw-bold small muted-label">Dell JIRA Number</label>
                <input type="text" id="dellJiraInput" class="form-control" placeholder="JIRA-XXXXX（選填）">
            </div>
            <div class="mb-3 ami-only-field">
                <label class="form-label fw-bold small muted-label">Dell Issue Link</label>
                <input type="url" id="dellLinkInput" class="form-control" placeholder="https://...（選填）">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
            <button type="button" class="btn btn-primary" onclick="addIssue()">確認新增</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 編輯彈出視窗 -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title fw-bold">編輯 Issue</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editIndex">
            <div class="mb-3">
                <label class="form-label fw-bold small muted-label">Status</label>
                <select id="editStatus" class="form-select">
                    <option value="Open">Open</option>
                    <option value="Closed">Closed</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold small muted-label">Function</label>
                <input type="text" id="editFunction" class="form-control" list="funcList">
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold small muted-label">Jira Number</label>
                <input type="text" id="editJira" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold small muted-label">Issue Title</label>
                <input type="text" id="editTitle" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold small muted-label">Issue Link</label>
                <input type="url" id="editLink" class="form-control" required>
            </div>
            <div class="mb-3 ami-only-field">
                <label class="form-label fw-bold small muted-label">Dell JIRA Number</label>
                <input type="text" id="editDellJira" class="form-control" placeholder="JIRA-XXXXX（選填）">
            </div>
            <div class="mb-3 ami-only-field">
                <label class="form-label fw-bold small muted-label">Dell Issue Link</label>
                <input type="url" id="editDellLink" class="form-control" placeholder="https://...（選填）">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
            <button type="button" class="btn btn-primary" onclick="saveEdit()">儲存變更</button>
          </div>
        </div>
      </div>
    </div>

    <script>
        const GITHUB_REPO = "WT-Jerry/ami-jira-tracker";
        const WORKSPACES = {
            ami: {
                id: "ami",
                name: "AMI JIRA Tracker",
                subtitle: "AMI 案件追蹤 · GitHub data.json",
                file: "data.json",
                theme: "theme-ami",
                exportName: "AMI_JIRA_Report.csv",
                tabId: "tabAmi"
            },
            dell: {
                id: "dell",
                name: "Dell JIRA Tracker",
                subtitle: "Dell 案件追蹤 · GitHub dell-data.json · Black theme",
                file: "dell-data.json",
                theme: "theme-dell",
                exportName: "Dell_JIRA_Report.csv",
                tabId: "tabDell"
            }
        };

        let currentWorkspace = "ami";
        let issues = [];
        let editModal;
        let addModal;
        let fileSha = "";

        function getWorkspace() {
            return WORKSPACES[currentWorkspace];
        }

        function getApiUrl() {
            return `https://api.github.com/repos/${GITHUB_REPO}/contents/${getWorkspace().file}`;
        }

        function openAddModal() {
            // 清空並重置表單
            document.getElementById('statusInput').value = 'Open';
            ['functionInput', 'jiraInput', 'titleInput', 'linkInput', 'dellJiraInput', 'dellLinkInput'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.value = '';
            });
            addModal.show();
        }

        function openEdit(index) {
            const issue = issues[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('editStatus').value = issue.status;
            document.getElementById('editFunction').value = issue.function || '';
            document.getElementById('editJira').value = issue.jira_number;
            document.getElementById('editTitle').value = issue.title;
            document.getElementById('editLink').value = issue.link;
            document.getElementById('editDellJira').value = issue.dell_jira_number || '';
            document.getElementById('editDellLink').value = issue.dell_link || '';
            editModal.show();
        }

        function isAmiWorkspace() {
            return currentWorkspace === 'ami';
        }

        function formatDellJiraCell(issue) {
            const num = (issue.dell_jira_number || '').trim();
            const url = (issue.dell_link || '').trim();
            if (!num) return '<span class="text-muted">N/A</span>';
            if (url) {
                return `<a href="${url}" target="_blank" class="dell-jira-link jira-code">${num}</a>`;
            }
            return `<span class="dell-jira-text jira-code">${num}</span>`;
        }

        function getColspan() {
            return isAmiWorkspace() ? 7 : 6;
        }

        window.onload = () => {
            editModal = new bootstrap.Modal(document.getElementById('editModal'));
            addModal = new bootstrap.Modal(document.getElementById('addModal'));
            const savedPAT = localStorage.getItem('github_pat');
            if (savedPAT) document.getElementById('patInput').value = savedPAT;

            // 還原上次分頁，並一定要抓取資料（先前 reload=false 會卡在「讀取中...」）
            const savedWorkspace = localStorage.getItem('jira_workspace');
            if (savedWorkspace && WORKSPACES[savedWorkspace]) {
                switchWorkspace(savedWorkspace, true);
            } else {
                applyWorkspaceUI();
                fetchIssues();
            }
        };

        function switchWorkspace(id, reload = true) {
            if (!WORKSPACES[id]) return;
            currentWorkspace = id;
            localStorage.setItem('jira_workspace', id);
            issues = [];
            fileSha = "";
            applyWorkspaceUI();
            if (reload) fetchIssues();
        }

        function applyWorkspaceUI() {
            const ws = getWorkspace();
            document.body.classList.remove('theme-ami', 'theme-dell');
            document.body.classList.add(ws.theme);
            document.getElementById('pageTitle').innerText = ws.name;
            document.getElementById('pageSubtitle').innerText = ws.subtitle;
            document.title = `${ws.name} | AMI & Dell`;
            document.getElementById('tabAmi').classList.toggle('active', ws.id === 'ami');
            document.getElementById('tabDell').classList.toggle('active', ws.id === 'dell');
            document.querySelector('.loading-text').classList.toggle('text-info', ws.id === 'dell');
            document.querySelector('.loading-text').classList.toggle('text-primary', ws.id === 'ami');

            // AMI 專屬欄位：Dell JIRA Number / Dell Link
            document.querySelectorAll('.ami-only-field, .ami-only-col').forEach(el => {
                el.style.display = ws.id === 'ami' ? '' : 'none';
            });

            document.getElementById('issueList').innerHTML =
                `<tr><td colspan="${getColspan()}" class="text-center py-5">讀取中...</td></tr>`;
            document.getElementById('openCount').innerText = '0';
            document.getElementById('closedCount').innerText = '0';
            document.getElementById('totalCount').innerText = '0';
        }

        function savePAT() {
            const pat = document.getElementById('patInput').value;
            localStorage.setItem('github_pat', pat);
            fetchIssues();
        }

        async function getHeaders() {
            const pat = localStorage.getItem('github_pat');
            if (!pat) throw new Error("請先輸入並儲存 GitHub PAT");
            return {
                "Authorization": `token ${pat}`,
                "Content-Type": "application/json",
                "Accept": "application/vnd.github.v3+json"
            };
        }

        // 安全的 base64 編碼（支援中文）
        function encodeContent(obj) {
            const json = JSON.stringify(obj, null, 4);
            return btoa(unescape(encodeURIComponent(json)));
        }

        function decodeContent(b64) {
            const decoded = decodeURIComponent(escape(atob(b64)));
            return JSON.parse(decoded);
        }

        async function fetchIssues() {
            showLoading(true);
            try {
                const response = await fetch(getApiUrl(), { headers: await getHeaders() });
                if (response.status === 404) {
                    // 首次建立 Dell 檔案
                    issues = [];
                    fileSha = "";
                    await createGitHubFile([]);
                    renderIssues();
                    showLoading(false);
                    return;
                }
                if (!response.ok) throw new Error(`讀取失敗 (${response.status})`);
                const data = await response.json();
                fileSha = data.sha;
                issues = decodeContent(data.content);
                if (!Array.isArray(issues)) issues = [];
                renderIssues();
            } catch (error) {
                console.error(error);
                alert("GitHub 資料讀取失敗，請確認 PAT 權限是否正確，或檢查 Console 錯誤訊息\n" + error.message);
            }
            showLoading(false);
        }

        async function createGitHubFile(newContent) {
            const response = await fetch(getApiUrl(), {
                method: "PUT",
                headers: await getHeaders(),
                body: JSON.stringify({
                    message: `Create ${getWorkspace().file}`,
                    content: encodeContent(newContent)
                })
            });
            if (!response.ok) {
                const err = await response.text();
                throw new Error("建立檔案失敗: " + err);
            }
            const result = await response.json();
            fileSha = result.content.sha;
        }

        async function updateGitHubFile(newContent) {
            showLoading(true);
            try {
                // 寫入前重新抓一次 SHA，降低 409 衝突
                const head = await fetch(getApiUrl(), { headers: await getHeaders() });
                if (head.ok) {
                    const headData = await head.json();
                    fileSha = headData.sha;
                } else if (head.status === 404) {
                    await createGitHubFile(newContent);
                    issues = newContent;
                    renderIssues();
                    showLoading(false);
                    return;
                }

                const response = await fetch(getApiUrl(), {
                    method: "PUT",
                    headers: await getHeaders(),
                    body: JSON.stringify({
                        message: `Update ${getWorkspace().file}`,
                        content: encodeContent(newContent),
                        sha: fileSha
                    })
                });
                if (!response.ok) {
                    const err = await response.text();
                    throw new Error("更新失敗: " + err);
                }
                const result = await response.json();
                fileSha = result.content.sha;
                issues = newContent;
                renderIssues();
            } catch (e) {
                console.error(e);
                alert("更新失敗：" + e.message);
            }
            showLoading(false);
        }

        function renderIssues() {
            const list = document.getElementById('issueList');
            const search = document.getElementById('searchInput').value.toLowerCase();
            list.innerHTML = '';
            let stats = { Open: 0, Closed: 0, Total: 0 };
            const ami = isAmiWorkspace();

            // 最新在上
            issues.slice().reverse().forEach((issue, index) => {
                const originalIndex = issues.length - 1 - index;
                const searchableText = `${issue.jira_number} ${issue.title} ${issue.function} ${issue.dell_jira_number || ''}`.toLowerCase();
                if (!searchableText.includes(search)) return;

                stats.Total++;
                stats[issue.status] = (stats[issue.status] || 0) + 1;

                const dellCell = ami
                    ? `<td data-label="Dell JIRA Number">${formatDellJiraCell(issue)}</td>`
                    : '';

                list.innerHTML += `
                    <tr>
                        <td class="ps-md-4" data-label="Index"><span class="fw-bold muted-label">#${originalIndex + 1}</span></td>
                        <td data-label="Status">
                            <div class="dropdown status-dropdown">
                                <button class="btn status-pill-btn dropdown-toggle ${issue.status === 'Open' ? 'bg-open' : 'bg-closed'}" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                    ${issue.status}
                                </button>
                                <ul class="dropdown-menu status-menu">
                                    <li>
                                        <button type="button" class="dropdown-item status-opt-open ${issue.status === 'Open' ? 'active-opt' : ''}" onclick="updateStatus(${originalIndex}, 'Open')">Open</button>
                                    </li>
                                    <li>
                                        <button type="button" class="dropdown-item status-opt-closed ${issue.status === 'Closed' ? 'active-opt' : ''}" onclick="updateStatus(${originalIndex}, 'Closed')">Closed</button>
                                    </li>
                                </ul>
                            </div>
                        </td>
                        <td data-label="Function"><span class="badge bg-light text-dark border p-2">${issue.function || 'N/A'}</span></td>
                        <td data-label="Jira Number"><span class="jira-code">${issue.jira_number}</span></td>
                        ${dellCell}
                        <td data-label="Title"><a href="${issue.link}" target="_blank" class="text-decoration-none fw-semibold">${issue.title}</a></td>
                        <td class="text-center pe-md-4">
                            <button onclick="openEdit(${originalIndex})" class="btn btn-link text-primary p-0 me-3"><i class="bi bi-pencil-square fs-5"></i></button>
                            <button onclick="deleteIssue(${originalIndex})" class="btn btn-link text-danger p-0"><i class="bi bi-trash3 fs-5"></i></button>
                        </td>
                    </tr>
                `;
            });

            if (!list.innerHTML) {
                list.innerHTML = `<tr><td colspan="${getColspan()}" class="text-center py-5 muted-label">目前沒有符合條件的案件</td></tr>`;
            }

            document.getElementById('openCount').innerText = stats.Open || 0;
            document.getElementById('closedCount').innerText = stats.Closed || 0;
            document.getElementById('totalCount').innerText = stats.Total || 0;
        }

        async function addIssue() {
            const n = {
                status: document.getElementById('statusInput').value,
                function: document.getElementById('functionInput').value,
                jira_number: document.getElementById('jiraInput').value,
                title: document.getElementById('titleInput').value,
                link: document.getElementById('linkInput').value
            };
            if (isAmiWorkspace()) {
                n.dell_jira_number = document.getElementById('dellJiraInput').value.trim();
                n.dell_link = document.getElementById('dellLinkInput').value.trim();
            }
            if (!n.jira_number || !n.title) return alert('請填寫必填欄位');
            addModal.hide();
            const next = [...issues, n];
            await updateGitHubFile(next);
            ['functionInput', 'jiraInput', 'titleInput', 'linkInput', 'dellJiraInput', 'dellLinkInput'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.value = '';
            });
            document.getElementById('statusInput').value = 'Open';
        }

        async function saveEdit() {
            const index = Number(document.getElementById('editIndex').value);
            const next = [...issues];
            const updated = {
                status: document.getElementById('editStatus').value,
                function: document.getElementById('editFunction').value,
                jira_number: document.getElementById('editJira').value,
                title: document.getElementById('editTitle').value,
                link: document.getElementById('editLink').value
            };
            if (isAmiWorkspace()) {
                updated.dell_jira_number = document.getElementById('editDellJira').value.trim();
                updated.dell_link = document.getElementById('editDellLink').value.trim();
            } else {
                // 保留既有欄位（理論上 Dell workspace 不會有，但避免誤刪）
                if (next[index].dell_jira_number !== undefined) updated.dell_jira_number = next[index].dell_jira_number;
                if (next[index].dell_link !== undefined) updated.dell_link = next[index].dell_link;
            }
            next[index] = updated;
            editModal.hide();
            await updateGitHubFile(next);
        }

        async function updateStatus(index, newStatus) {
            const next = [...issues];
            next[index] = { ...next[index], status: newStatus };
            await updateGitHubFile(next);
        }

        async function deleteIssue(index) {
            if (!confirm('確定刪除？')) return;
            const next = issues.filter((_, i) => i !== index);
            await updateGitHubFile(next);
        }

        function exportToExcel() {
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
            if (isAmiWorkspace()) {
                csvContent += "Status,Function,Jira Number,Dell Jira Number,Dell Link,Issue Title,Link\n";
            } else {
                csvContent += "Status,Function,Jira Number,Issue Title,Link\n";
            }
            // 匯出也以最新在前
            issues.slice().reverse().forEach(issue => {
                let row;
                if (isAmiWorkspace()) {
                    row = `"${issue.status}","${issue.function || ''}","${issue.jira_number}","${issue.dell_jira_number || ''}","${issue.dell_link || ''}","${issue.title}","${issue.link}"\n`;
                } else {
                    row = `"${issue.status}","${issue.function || ''}","${issue.jira_number}","${issue.title}","${issue.link}"\n`;
                }
                csvContent += row;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", getWorkspace().exportName);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function showLoading(s) {
            document.getElementById('loading').style.display = s ? 'flex' : 'none';
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
